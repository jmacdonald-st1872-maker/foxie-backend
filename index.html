<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foxie 🦊</title>

<style>
:root{
  --green:#39ff14;
  --bg:#020604;
  --panel:#07120b;
  --panel2:#0a190e;
  --line:#174d25;
  --text:#d9ffe0;
  --muted:#82a98a;
  --danger:#ff4d67;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#0b2613 0,#020604 45%,#010302 100%);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(57,255,20,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,255,20,.05) 1px,transparent 1px);
  background-size:40px 40px;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--line);
  background:rgba(2,6,4,.94);
  backdrop-filter:blur(14px);
}

.top{
  max-width:1500px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--green);
  text-shadow:0 0 14px rgba(57,255,20,.4);
  white-space:nowrap;
}

.search{
  flex:1;
  min-width:150px;
  background:#030805;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 15px;
  color:white;
  outline:none;
}

.search:focus{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(57,255,20,.12);
}

.creator{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.creator strong{
  color:var(--green);
}

nav{
  max-width:1500px;
  margin:auto;
  display:flex;
  gap:5px;
  padding:0 20px 12px;
  overflow-x:auto;
}

nav button{
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
}

nav button:hover,
nav button.active{
  color:var(--green);
  border-color:var(--line);
  background:#07140a;
}

main{
  max-width:1500px;
  margin:auto;
  padding:28px 20px 80px;
}

.hero{
  min-height:310px;
  border:1px solid var(--line);
  border-radius:22px;
  padding:34px;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 80% 20%,rgba(57,255,20,.13),transparent 28%),
    linear-gradient(135deg,#07160b,#020604 70%);
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"🦊";
  position:absolute;
  right:7%;
  bottom:-35px;
  font-size:210px;
  opacity:.12;
  transform:rotate(-8deg);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:760px;
}

.tag{
  display:inline-block;
  border:1px solid var(--line);
  color:var(--green);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  margin-bottom:14px;
}

h1{
  font-size:clamp(38px,6vw,74px);
  margin:0 0 12px;
  line-height:.95;
}

.hero p{
  color:#a9c9af;
  font-size:17px;
  line-height:1.6;
  max-width:700px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.primary,
.secondary{
  border-radius:10px;
  padding:12px 17px;
  cursor:pointer;
  font-weight:800;
}

.primary{
  background:var(--green);
  color:#031005;
  border:1px solid var(--green);
}

.secondary{
  background:#07140a;
  color:var(--text);
  border:1px solid var(--line);
}

section{
  margin-top:34px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:15px;
}

.section-head h2{
  margin:0;
  font-size:25px;
}

.section-head span{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}

.card{
  min-height:170px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  cursor:pointer;
  transition:.18s;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#2d813e;
  background:#0b1d10;
}

.card .emoji{
  font-size:39px;
  margin-bottom:10px;
}

.card h3{
  margin:0 0 7px;
  font-size:17px;
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.badge{
  position:absolute;
  right:12px;
  top:12px;
  color:var(--green);
  font-size:10px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 7px;
}

.tournament{
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  background:#061009;
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;
}

.tournament + .tournament{
  margin-top:10px;
}

.tournament h3{
  margin:0 0 6px;
}

.tournament p{
  margin:0;
  color:var(--muted);
}

.countdown{
  color:var(--green);
  font-weight:900;
  font-size:22px;
  text-align:right;
}

.feature{
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  background:linear-gradient(135deg,#08170c,#040a06);
}

.feature h3{
  margin-top:0;
  color:var(--green);
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.stat{
  padding:17px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#050d07;
}

.stat strong{
  display:block;
  font-size:25px;
  color:var(--green);
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

footer{
  border-top:1px solid var(--line);
  text-align:center;
  padding:30px 20px;
  color:var(--muted);
  font-size:12px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#07140a;
  border:1px solid var(--green);
  color:var(--text);
  padding:12px 17px;
  border-radius:10px;
  display:none;
  z-index:300;
}

@media(max-width:700px){
  .top{
    flex-wrap:wrap;
  }

  .creator{
    display:none;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    padding:25px;
  }

  .hero:after{
    font-size:130px;
  }

  .tournament{
    grid-template-columns:1fr;
  }

  .countdown{
    text-align:left;
  }
}
</style>
</head>

<main id="app"></main>

function card(item){

  music:musicPage,
  videos:videosPage,
  avatars:avatarsPage,
  creator:creatorPage,
  social:socialPage,
  world:worldPage
};

const app = document.getElementById("app");
const nav = document.getElementById("nav");
const search = document.getElementById("search");
const toast = document.getElementById("toast");

function show(name){
  app.innerHTML = pages[name] ? pages[name]() : pages.home();

  document.querySelectorAll("nav button").forEach(button=>{
    button.classList.toggle("active",button.dataset.section===name);
  });

  startCountdowns();
  window.scrollTo({top:0,behavior:"smooth"});
}

nav.addEventListener("click",event=>{
  const button = event.target.closest("button[data-section]");
  if(!button)return;
  show(button.dataset.section);
});

document.addEventListener("click",event=>{
  const go = event.target.closest("[data-go]");
  if(go){
    show(go.dataset.go);
    return;
  }

  const action = event.target.closest("[data-action]");
  if(action){
    notify("Opening " + action.dataset.action + " — this experience will connect to its game backend.");
    return;
  }

  const toastButton = event.target.closest("[data-toast]");
  if(toastButton){
    notify(toastButton.dataset.toast);
  }
});

search.addEventListener("keydown",event=>{
  if(event.key !== "Enter")return;

  const q = search.value.trim().toLowerCase();

  if(!q){
    show("games");
    return;
  }

  const results = games.filter(g =>
    g[1].toLowerCase().includes(q) ||
    g[2].toLowerCase().includes(q)
  );

  app.innerHTML = `
    ${sectionHead("🔎 Search Results",results.length + " found")}
    <div class="grid">
      ${
        results.length
        ? results.map(card).join("")
        : `<div class="feature"><h3>No results yet</h3><p>Try another search.</p></div>`
      }
    </div>
  `;

  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  startCountdowns();
});

function notify(message){
  toast.textContent = message;
  toast.style.display="block";
  clearTimeout(window.__foxieToast);
  window.__foxieToast=setTimeout(()=>{
    toast.style.display="none";
  },3000);
}

function startCountdowns(){
  document.querySelectorAll(".countdown").forEach(el=>{
    const start = el.dataset.time;
    if(!start)return;

    const [h,m] = start.split(":").map(Number);

    function update(){
      const now = new Date();
      const target = new Date(now);

      target.setHours(h,m,0,0);

      if(target <= now){
        target.setDate(target.getDate()+1);
      }

      const diff = Math.max(0,target-now);

      const hours = Math.floor(diff/3600000);
      const minutes = Math.floor((diff%3600000)/60000);
      const seconds = Math.floor((diff%60000)/1000);

      el.textContent =
        String(hours).padStart(2,"0") + ":" +
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0");
    }

    update();
    const timer=setInterval(update,1000);

    el.dataset.timer=timer;
  });
}

show("home");
</script>

</body>
</html>
